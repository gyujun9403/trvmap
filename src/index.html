<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진 동선 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<!-- 구글 로그인(연동용). 오프라인·file:// 에선 로드 실패해도 앱은 정상 동작하고 연동만 비활성화됨 -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>/*__LEAFLET_CSS__*/</style>
<style>
/* Layout: 상단 도구줄 + 날짜 탭, 아래는 왼쪽 일지(묶음 카드) / 오른쪽 지도. 좁은 화면에서는 지도 위, 일지 아래. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --surface-2: #f6f7f4;
  --ink: #1b2220;
  --muted: #5f6b66;
  --line: #d6dbd5;
  --accent: #1d5c87;
  --accent-ink: #ffffff;
  --accent-soft: #e2edf5;
  --warn: #9a5b00;
  --shadow: 0 1px 2px rgba(20,30,28,.06), 0 4px 16px rgba(20,30,28,.06);
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #181d1b; --surface-2: #1e2421; --ink: #e4e9e6; --muted: #97a39d;
    --line: #2d3532; --accent: #74b3e0; --accent-ink: #0d1a24; --accent-soft: #1b2b37; --warn: #e2a24a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181d1b; --surface-2: #1e2421; --ink: #e4e9e6; --muted: #97a39d;
  --line: #2d3532; --accent: #74b3e0; --accent-ink: #0d1a24; --accent-soft: #1b2b37; --warn: #e2a24a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font-body);
  /* flex 컬럼: 헤더/배너/탭은 내용 높이, .layout 이 남은 높이를 전부 차지(숨은 요소 개수와 무관하게 지도 높이 보장) */
  display: flex; flex-direction: column; overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Top bar */
.top {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.save-status { font-size: 12px; color: var(--muted); }
.save-status.bad { color: var(--warn); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500;
  white-space: nowrap; cursor: pointer; user-select: none;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: default; }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-panel {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 1200; width: min(300px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 8px; display: grid; gap: 4px;
}
.menu-panel .item {
  display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: none; font-size: 13px; cursor: pointer;
}
.menu-panel .item:hover { background: var(--surface-2); }
.menu-panel .item small { display: block; color: var(--muted); font-size: 12px; }
.menu-panel hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.sync-info { padding: 6px 10px 8px; font-size: 12px; color: var(--muted); line-height: 1.5; word-break: break-all; }
#syncSummary.bad { color: var(--warn); }
.setting { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; font-size: 13px; }
.setting small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-top: -4px; }
.setting input { width: 76px; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); text-align: right; }

.banner {
  padding: 8px 16px; font-size: 13px; background: var(--accent-soft); color: var(--ink); border-bottom: 1px solid var(--line);
}
.banner b { color: var(--accent); }

/* Day tabs */
.days {
  display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--line);
  scrollbar-width: thin;
}
.day-tab {
  flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-size: 13px; cursor: pointer;
}
.day-tab .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.day-tab .n { color: var(--muted); font-size: 12px; }
.day-tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day-tab[aria-selected="true"] .n { color: inherit; opacity: .7; }
.places { background: var(--surface-2); }
.places .day-tab { font-weight: 600; }
.places .day-tab .pin { color: var(--accent); font-size: 11px; }
.places .day-tab[aria-selected="true"] .pin { color: inherit; }
.places .day-tab.none { font-weight: 500; font-style: italic; }
.places .day-tab.add { border-style: dashed; color: var(--accent); background: transparent; }
.places .hint { align-self: center; white-space: nowrap; }
.trip-new { flex: none; width: 220px; height: 32px; padding: 0 12px; border: 1px solid var(--accent); border-radius: 999px; background: var(--surface); font-size: 13px; }
.trip-new:focus { outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
.ptitle-row { display: flex; gap: 8px; align-items: center; }

/* Main layout */
.layout { flex: 1 1 0; display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); min-height: 0; }
.panel { overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg); padding-block: 14px 40px; }
.panel-inner { display: grid; gap: 12px; padding: 0 16px; }
.mapwrap { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--surface-2); }
.map-switch {
  position: absolute; top: 10px; right: 10px; z-index: 900; display: flex; border-radius: 6px; overflow: hidden;
  border: 1px solid rgba(0,0,0,.2); box-shadow: 0 1px 4px rgba(0,0,0,.15);
}
.map-switch button { border: 0; padding: 6px 10px; font-size: 12px; background: #fff; color: #1b2220; }
.map-switch button[aria-pressed="true"] { background: #1b2220; color: #fff; }

/* Day header */
.dayhead { display: grid; gap: 8px; }
.dayhead h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 600; }
.note {
  width: 100%; min-height: 64px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); line-height: 1.55; font-size: 13.5px;
}
.note::placeholder, .gtitle::placeholder { color: var(--muted); opacity: .8; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }

/* Group card */
.group {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px;
  scroll-margin: 12px;
}
.group.selected { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), var(--shadow); }
.ghead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.gnum {
  width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--c); color: #fff; font-weight: 700; font-size: 13px;
  display: grid; place-items: center; font-family: var(--font-mono);
}
.gnum.nogps { background: transparent; color: var(--muted); border: 1.5px dashed var(--muted); }
.gmeta { min-width: 0; display: grid; gap: 2px; }
.gtitle {
  width: 100%; border: 0; border-bottom: 1px solid transparent; background: transparent; padding: 2px 0; font-size: 15px; font-weight: 600;
}
.gtitle:hover, .gtitle:focus { border-bottom-color: var(--line); outline: none; }
.gsub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.gsub a { color: var(--accent); text-decoration: none; }
.gsub a:hover { text-decoration: underline; }
.gplace { max-width: 140px; height: 22px; padding: 0 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); font-size: 12px; color: var(--muted); }
.ptitle {
  width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 2px 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em;
}
.ptitle:focus { border-bottom-color: var(--accent); outline: none; }
.ptitle::placeholder { color: var(--muted); opacity: .8; font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); }
.others { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.small-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 8px; font-size: 12px; color: var(--muted); white-space: nowrap;
}
.small-btn:hover { color: var(--ink); background: var(--surface-2); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.thumb {
  position: relative; padding: 0; border: 0; border-radius: 5px; overflow: hidden; aspect-ratio: 1; background: var(--surface-2); max-width: 100%;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; color: var(--muted); }
.thumb .t {
  position: absolute; left: 4px; bottom: 4px; padding: 0 4px; border-radius: 3px; background: rgba(0,0,0,.55); color: #fff; font-size: 10.5px;
  font-family: var(--font-mono);
}
.thumb .dot { position: absolute; right: 4px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: #ffd24a; box-shadow: 0 0 0 1.5px rgba(0,0,0,.4); }
.thumb .nog { position: absolute; left: 4px; top: 4px; padding: 0 4px; border-radius: 3px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; }
.thumb:hover img { filter: brightness(1.08); }
.pnotes { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.pnotes li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.pnotes button { border: 0; background: none; padding: 0; color: var(--accent); font-family: var(--font-mono); font-size: 12px; }
.pnotes span { white-space: pre-wrap; overflow-wrap: anywhere; }
.leg { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 6px 0 14px; }
.leg::before { content: ""; width: 2px; height: 22px; background: var(--c); opacity: .6; border-radius: 2px; }

/* Overview */
.daycard {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; text-align: left; width: 100%;
  padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
}
.daycard:hover { border-color: var(--c); }
.daycard .sw { width: 12px; height: 12px; border-radius: 50%; background: var(--c); grid-row: span 2; }
.placecard .sw { border-radius: 3px; transform: rotate(45deg) scale(.85); }
.daycard h3 { margin: 0; font-size: 15px; }
.daycard p { margin: 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h2 { color: var(--ink); margin: 0; font-size: 18px; }

/* Map markers */
.gmark span {
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--c); color: #fff;
  font: 700 12px/1 "IBM Plex Mono", ui-monospace, monospace; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35);
}
.gmark.sel span { transform: scale(1.25); box-shadow: 0 0 0 3px rgba(0,0,0,.25); }
.gmark.day span { width: auto; padding: 0 8px; border-radius: 14px; white-space: nowrap; }
.gmark.place span { width: auto; padding: 0 10px; border-radius: 14px; height: 30px; font: 600 13px/1 "IBM Plex Sans KR", system-ui, sans-serif; white-space: nowrap; }
.leaflet-tooltip { font-family: var(--font-body); font-size: 12px; }
/* 장소 이름 라벨: 이름을 붙인 묶음은 마커 옆에 항상 표시 */
.leaflet-tooltip.glabel { padding: 2px 7px; border: 0; border-radius: 4px; font-weight: 600; color: #1b2220; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.leaflet-tooltip.glabel::before { display: none; }
.leaflet-tooltip.glabel.small { font-size: 11px; padding: 1px 6px; }

/* Lightbox */
.lightbox {
  position: fixed; inset: 0; z-index: 2000; background: rgba(8,10,9,.94); color: #eef1ef;
  display: grid; grid-template-columns: minmax(0, 1fr) 340px;
}
.lb-stage { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; padding: 16px; }
.lb-stage img { max-width: 100%; max-height: calc(100vh - 32px); object-fit: contain; border-radius: 3px; }
.lb-loading { position: absolute; font-size: 13px; color: #aab5b0; }
.lb-nav {
  position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; border: 0; border-radius: 6px;
  background: rgba(255,255,255,.08); color: #fff; font-size: 26px;
}
.lb-nav:hover { background: rgba(255,255,255,.16); }
.lb-nav.prev { left: 12px; } .lb-nav.next { right: 12px; }
.lb-side {
  background: #161a18; border-left: 1px solid #2a312e; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px; overflow-y: auto;
  display: grid; align-content: start; gap: 12px;
}
.lb-top { display: flex; justify-content: space-between; align-items: center; }
.lb-top .mono { color: #97a39d; font-size: 12px; }
.lb-close { border: 1px solid #333b38; background: none; color: #eef1ef; border-radius: 6px; padding: 5px 10px; font-size: 13px; }
.lb-time { font-size: 18px; font-weight: 600; }
.lb-file { font-size: 12px; color: #97a39d; overflow-wrap: anywhere; }
.lb-group { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: #1f2522; }
.lb-side select { height: 34px; padding: 0 8px; border-radius: 6px; border: 1px solid #333b38; background: #0f1211; color: #eef1ef; font-size: 13px; }
.lb-side label { font-size: 11px; letter-spacing: .06em; color: #97a39d; font-weight: 600; }
.lb-side textarea {
  width: 100%; min-height: 140px; resize: vertical; padding: 10px 12px; border-radius: 6px; border: 1px solid #333b38; background: #0f1211; color: #eef1ef;
  font-size: 14px; line-height: 1.55;
}
.lb-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.lb-actions button, .lb-actions a {
  border: 1px solid #333b38; background: #1f2522; color: #eef1ef; border-radius: 6px; padding: 7px 10px; font-size: 13px; text-decoration: none;
}
.lb-actions button:hover, .lb-actions a:hover { background: #29302d; }
.lb-hint { font-size: 11.5px; color: #7d8883; }

/* Overlays */
.drop {
  position: fixed; inset: 12px; z-index: 3000; border: 2px dashed var(--accent); border-radius: 12px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  display: grid; place-items: center; font-size: 18px; font-weight: 600; color: var(--accent); pointer-events: none;
}
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 3100;
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow);
  max-width: calc(100vw - 32px);
}
.progress { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 3050;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12px; box-shadow: var(--shadow);
  display: grid; gap: 6px; width: min(280px, calc(100vw - 32px));
}
.progress .bar { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

@media (max-width: 820px) {
  body { overflow: auto; display: block; }
  .layout { display: flex; flex-direction: column; }
  .mapwrap { order: -1; height: 46vh; min-height: 280px; position: sticky; top: 0; z-index: 5; }
  .panel { overflow: visible; border-right: 0; }
  .lightbox { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .lb-stage img { max-height: 58vh; }
  .lb-side { border-left: 0; border-top: 1px solid #2a312e; max-height: 42vh; }
  .lb-side textarea { min-height: 90px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>사진 동선 지도</h1>
    <span class="save-status" id="saveStatus"></span>
  </div>
  <div class="actions">
    <label class="btn primary" for="fileInput">사진 추가</label>
    <input type="file" id="fileInput" multiple accept="image/*,.heic,.heif,.HEIC,.HEIF" hidden>
    <label class="btn" for="dirInput">폴더 추가</label>
    <input type="file" id="dirInput" webkitdirectory directory multiple hidden>
    <details class="menu" id="menuSync" hidden>
      <summary class="btn" id="syncSummary">연동</summary>
      <div class="menu-panel">
        <div class="sync-info" id="syncInfo"></div>
        <button class="item" id="btnSignIn">구글 계정으로 로그인<small>내 드라이브에 사진·메모를 저장해 다른 기기·모바일에서 이어 봅니다</small></button>
        <button class="item" id="btnSyncNow" hidden>지금 동기화<small>바뀐 사진·메모를 드라이브에 올립니다</small></button>
        <button class="item" id="btnRecover" hidden>드라이브에서 복구<small>목록이 비어 보일 때 드라이브 폴더의 사진을 다시 읽어 복원합니다</small></button>
        <button class="item" id="btnSignOut" hidden>로그아웃<small>이 기기에서 연동을 해제합니다</small></button>
      </div>
    </details>
    <details class="menu" id="menuData">
      <summary class="btn">메모 · 내보내기</summary>
      <div class="menu-panel">
        <button class="item" id="btnExportNotes">메모 파일로 저장<small>.json 파일로 백업 (다른 PC·브라우저로 옮길 때)</small></button>
        <label class="item" for="importInput">메모 파일 불러오기<small>저장해 둔 .json 파일의 메모를 합칩니다</small></label>
        <input type="file" id="importInput" accept=".json,application/json" hidden>
        <hr>
        <button class="item" id="btnZipDay">이 날짜 사진 JPEG로 저장<small>선택한 날짜를 ZIP 하나로 (HEIC 등은 JPEG로 변환)</small></button>
        <button class="item" id="btnZipAll">전체 사진 JPEG로 저장<small>날짜별 ZIP 파일로 나눠 저장</small></button>
      </div>
    </details>
    <details class="menu" id="menuSettings">
      <summary class="btn">설정</summary>
      <div class="menu-panel">

<script>
"use strict";
(function () {
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const DAY_COLORS = ["#1d5c87", "#c2410c", "#2f7d4f", "#8a3fb0", "#b8860b", "#0f7c86", "#c0356b", "#566b1f", "#6b4f2a", "#3b4fb8"];
const LS_KEY = "photo-route-map.v1";

/* ---------- 연동(구글드라이브) 설정 ----------
 * 연동을 쓰려면 아래 GOOGLE_CLIENT_ID 에 본인 구글 클라우드 OAuth 웹 클라이언트 ID를 넣고 다시 빌드하세요.
 * 비워 두면 연동 기능이 숨겨지고 앱은 기존처럼 로컬 전용으로 동작합니다. (README '연동 설정' 참고)
 */
const GOOGLE_CLIENT_ID = "884690867095-t9glt2sfa7hsl09vpvqdhtov09hau9l2.apps.googleusercontent.com";
const DRIVE_FOLDER_NAME = "사진동선지도";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_PROJECT_NAME = "project.json";

/* ---------- store (메모·설정) ---------- */
function emptyStore() {
  return { v: 1, photoNotes: {}, groupNotes: {}, dayNotes: {}, breaks: {}, trips: {}, photoTrip: {}, settings: { dayStartHour: 4, gapMin: 30, distM: 250 }, savedAt: null };
}
function mergeStore(base, s) {
  const out = emptyStore();
  for (const k of ["photoNotes", "groupNotes", "dayNotes", "breaks", "trips", "photoTrip"]) out[k] = Object.assign({}, base[k], s && s[k]);
  out.settings = Object.assign({}, base.settings, s && s.settings);
  out.savedAt = (s && s.savedAt) || base.savedAt;
  return out;
}
let storageOk = true;
function loadStore() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) return mergeStore(emptyStore(), s); }
  } catch (e) { storageOk = false; }
  return emptyStore();
}
let saveTimer = null;
function saveSoon() {
  if (state.demo) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 350);
}
function saveNow() {
  if (state.demo) return;
  state.store.savedAt = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state.store)); storageOk = true; }
  catch (e) { storageOk = false; }
  renderSaveStatus();
  if (isSignedIn()) { drive.dirty = true; scheduleSync(); }
}
function renderSaveStatus() {
  const el = $("#saveStatus");
  if (state.demo) { el.textContent = "예시 · 저장 안 됨"; el.className = "save-status"; return; }
  if (!storageOk) { el.textContent = "자동 저장 안 됨 · 메모 파일로 저장하세요"; el.className = "save-status bad"; return; }
  const t = state.store.savedAt ? new Date(state.store.savedAt) : null;
  el.textContent = t ? `이 브라우저에 자동 저장됨 · ${pad(t.getHours())}:${pad(t.getMinutes())}` : "메모는 이 브라우저에 자동 저장됩니다";
  el.className = "save-status";
}

/* ---------- state ---------- */
const state = {
  photos: [], byKey: new Map(), days: [], dayByKey: new Map(), places: [], placeById: new Map(),
  place: "all", current: "all", selectedGroup: null, demo: false, store: loadStore(), lb: null,
};

/* ---------- drive sync (구글드라이브 연동) ---------- */
const LS_CONNECTED = "photo-route-map.drive-connected";
const LS_TOKEN = "photo-route-map.drive-token"; // 액세스 토큰 캐시(약 1시간) — 새로고침해도 팝업 없이 재연결
function saveToken() { try { localStorage.setItem(LS_TOKEN, JSON.stringify(drive.token)); } catch (e) {} }
function clearToken() { drive.token = null; try { localStorage.removeItem(LS_TOKEN); } catch (e) {} }
function readSavedToken() {
  try { const t = JSON.parse(localStorage.getItem(LS_TOKEN) || "null"); if (t && t.access_token && t.expiry > Date.now() + 30000) return t; } catch (e) {}
  return null;
}
const drive = {
  ready: false, connected: false, wasConnected: false, tokenClient: null, token: null, email: null,
  folderId: null, thumbFolderId: null, projectFileId: null, loadedRev: 0,
  status: "off", statusText: "", dirty: false, loading: false,
};
function driveConfigured() { return !!GOOGLE_CLIENT_ID; }
function gisLoaded() { return typeof google !== "undefined" && google.accounts && google.accounts.oauth2; }
function isSignedIn() { return drive.connected; }
function setSync(status, text) { drive.status = status; drive.statusText = text || ""; renderSyncStatus(); if (!state.photos.length) renderPanel(); }

function initDrive() {
  if (!driveConfigured()) { setSync("disabled"); return; }
  let tries = 0;
  const t = setInterval(() => {
    if (gisLoaded()) {
      clearInterval(t);
      drive.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE, callback: onToken,
        error_callback: (err) => { const p = pendingToken; pendingToken = null; if (p) p.reject(new Error((err && err.type) || "로그인 취소")); },
      });
      drive.ready = true;
      // 저장해 둔 액세스 토큰이 아직 유효하면 팝업 없이 자동 재연결(새로고침해도 연동 유지).
      const saved = readSavedToken();
      if (saved) {
        drive.token = saved; drive.connected = true;
        setSync("syncing", "불러오는 중…");
        pullFromDrive().catch((e) => { console.error("[drive] auto-reconnect", e); if (isAuthError(e)) { clearToken(); drive.connected = false; drive.wasConnected = true; setSync("signedout"); } else setSync("error", e.message || String(e)); });
      } else {
        // GIS 토큰 모델은 조용한 토큰 획득이 없어 제스처(클릭) 없이는 팝업이 차단된다. 로드 시 자동 로그인하지 않음.
        drive.wasConnected = !!localStorage.getItem(LS_CONNECTED);
        setSync("signedout");
      }
    } else if (++tries > 40) { clearInterval(t); setSync("offline"); }
  }, 250);
}

/* --- token --- */
let pendingToken = null;
function onToken(resp) {
  const p = pendingToken; pendingToken = null;
  if (!p) return;
  if (resp && resp.error) { p.reject(new Error(resp.error)); return; }
  drive.token = { access_token: resp.access_token, expiry: Date.now() + (Number(resp.expires_in || 3600) - 60) * 1000 };
  drive.connected = true;
  saveToken();
  p.resolve(resp.access_token);
}
// GIS 토큰 모델: requestAccessToken 은 prompt 와 무관하게 '항상' 팝업을 연다 → 반드시 사용자 제스처에서만 호출.
function requestToken() {
  if (pendingToken) return pendingToken.promise;
  let resolve, reject;
  const promise = new Promise((res, rej) => { resolve = res; reject = rej; });
  pendingToken = { promise, resolve, reject };
  try { drive.tokenClient.requestAccessToken(); }
  catch (e) { pendingToken = null; reject(e); }
  return promise;
}
// allowPopup: 사용자 클릭(제스처) 중에만 true. 제스처가 없으면 토큰 요청(팝업)을 시도하지 않고 깔끔히 실패시킨다.
let allowPopup = false;
function ensureToken() {
  if (drive.token && drive.token.expiry > Date.now()) return Promise.resolve(drive.token.access_token);
  if (!allowPopup) return Promise.reject(new Error("로그인 필요"));
  return requestToken();
}

/* --- REST --- */
function rawFetch(url, opts) {
  const headers = Object.assign({ Authorization: "Bearer " + drive.token.access_token }, opts.headers);
  return fetch(url, Object.assign({}, opts, { headers }));
}
async function api(url, opts = {}) {
  await ensureToken();
  let resp = await rawFetch(url, opts);
  if (resp.status === 401) { clearToken(); await ensureToken(); resp = await rawFetch(url, opts); }
  if (!resp.ok) { const body = (await resp.text()).slice(0, 300); console.error("[drive] " + (opts.method || "GET") + " " + url + " → " + resp.status, body); throw new Error(`Drive ${resp.status}: ${body.slice(0, 150)}`); }
  return resp;
}
function isAuthError(e) { return /popup|token|interaction_required|access_denied|로그인/i.test((e && e.message) || ""); }
async function findOrCreateFolder(name, parent) {
  let q = `name='${name.replace(/'/g, "\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  if (parent) q += ` and '${parent}' in parents`;
  const r = await api(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)&spaces=drive`);
  const files = (await r.json()).files;
  if (files && files.length) return files[0].id;
  const meta = { name, mimeType: "application/vnd.google-apps.folder" };
  if (parent) meta.parents = [parent];
  const r2 = await api("https://www.googleapis.com/drive/v3/files?fields=id", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(meta) });
  return (await r2.json()).id;
}
async function ensureFolder() { if (!drive.folderId) drive.folderId = await findOrCreateFolder(DRIVE_FOLDER_NAME, null); return drive.folderId; }
async function ensureThumbFolder() { if (!drive.thumbFolderId) drive.thumbFolderId = await findOrCreateFolder("thumbs", await ensureFolder()); return drive.thumbFolderId; }
async function driveUpload(name, blob, mime, parentId) {
  const meta = { name, mimeType: mime }; if (parentId) meta.parents = [parentId];
  const boundary = "trvmap" + Math.random().toString(36).slice(2);
  const pre = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: ${mime}\r\n\r\n`;
  const body = new Blob([pre, blob, `\r\n--${boundary}--`], { type: "multipart/related; boundary=" + boundary });
  const r = await api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + boundary }, body });
  return (await r.json()).id;
}
async function driveUpdateContent(fileId, blob, mime) {
  const r = await api(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media&fields=id`, { method: "PATCH", headers: { "Content-Type": mime }, body: blob });
  return (await r.json()).id;
}
// 다시 추가한 사진이 가리키는 드라이브 원본이 실제로 있고 크기가 같은지 폴더 목록 한 번으로 확인.
// 없거나(지워짐) 크기가 다르면(깨진 업로드) 연결을 끊어 다음 동기화 때 다시 올린다.
async function verifyHealed(list) {
  try {
    const sizes = new Map((await driveListImages(await ensureFolder())).map((f) => [f.id, Number(f.size)]));
    let bad = 0;
    for (const p of list) {
      if (!p.file || !p.originalFileId || sizes.get(p.originalFileId) === p.file.size) continue;
      if (sizes.has(p.originalFileId)) p.replacedFileId = p.originalFileId;
      p.originalFileId = null; bad++; // 썸네일은 멀쩡하므로 그대로 둔다
    }
    if (bad) { console.warn(`[drive] 드라이브 원본과 다른 사진 ${bad}장 → 다시 올림`); drive.dirty = true; scheduleSync(); }
  } catch (e) { console.warn("[drive] 원본 확인 실패", e); }
}
function trashFile(fileId) {
  api(`https://www.googleapis.com/drive/v3/files/${fileId}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trashed: true }) })
    .catch((e) => console.warn("[drive] 옛 파일 휴지통 이동 실패", fileId, e));
}
async function driveDownload(fileId) { return (await api(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`)).blob(); }
async function driveDownloadRange(fileId, bytes) { return (await api(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Range: `bytes=0-${bytes - 1}` } })).blob(); }
async function driveListImages(parentId) {
  let out = [], pageToken = null;
  do {
    const q = `'${parentId}' in parents and trashed=false and mimeType contains 'image/'`;
    let url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=nextPageToken,files(id,name,mimeType,size)&pageSize=1000&spaces=drive`;
    if (pageToken) url += `&pageToken=${pageToken}`;
    const j = await (await api(url)).json();
    out.push(...(j.files || [])); pageToken = j.nextPageToken;
  } while (pageToken);
  return out;
}
async function loadProject() {
  const folderId = await ensureFolder();
  const q = `name='${DRIVE_PROJECT_NAME}' and '${folderId}' in parents and trashed=false`;
  const r = await api(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)`);
  const files = (await r.json()).files;
  if (!files || !files.length) return null;
  drive.projectFileId = files[0].id;
  return JSON.parse(await (await driveDownload(drive.projectFileId)).text());
}
async function saveProject(obj) {
  const folderId = await ensureFolder();
  const blob = new Blob([JSON.stringify(obj)], { type: "application/json" });
  if (drive.projectFileId) await driveUpdateContent(drive.projectFileId, blob, "application/json");
  else drive.projectFileId = await driveUpload(DRIVE_PROJECT_NAME, blob, "application/json", folderId);
}

/* --- project payload / merge --- */
function buildProject(rev) {
  return Object.assign({}, state.store, {
    v: 1, rev, savedAt: new Date().toISOString(),
    photos: state.photos.filter((p) => !p.demoUrl).map((p) => ({
      key: p.key, name: p.name, time: p.time.toISOString(), lat: p.lat, lng: p.lng,
      timeEstimated: !!p.timeEstimated, make: p.make || null, model: p.model || null,
      mime: p.mime || (p.file && p.file.type) || null, size: p.size || (p.file && p.file.size) || null,
      originalFileId: p.originalFileId || null, thumbFileId: p.thumbFileId || null,
    })),
  });
}
function photoFromRecord(rec) {
  return {
    key: rec.key, name: rec.name, file: null, time: new Date(rec.time), timeEstimated: !!rec.timeEstimated,
    lat: rec.lat, lng: rec.lng, make: rec.make, model: rec.model, mime: rec.mime, size: rec.size,
    originalFileId: rec.originalFileId, thumbFileId: rec.thumbFileId, thumbUrl: null, remote: true,
  };
}
function ingestIndex(records) {
  let added = 0;
  for (const rec of (records || [])) {
    const cur = state.byKey.get(rec.key);
    if (cur) { cur.originalFileId = cur.originalFileId || rec.originalFileId; cur.thumbFileId = cur.thumbFileId || rec.thumbFileId; continue; }
    const p = photoFromRecord(rec);
    state.photos.push(p); state.byKey.set(p.key, p); added++;
  }
  return added;
}

/* --- sync orchestration --- */
// 드라이브에서 불러오는 동안에는 업로드(push)를 보류한다. 목록을 받기 전에 올리면 이미 있는 사진을
// 모르고 다시 올리게 되므로, 불러오기가 끝난 뒤(이미 있는 사진은 연결된 상태로) 보류한 동기화를 이어서 한다.
let pulling = false;
async function pullFromDrive() {
  pulling = true;
  try { await pullCore(); }
  finally { pulling = false; if (pushQueued) { pushQueued = false; pushToDrive(); } }
}
async function pullCore() {
  setSync("syncing", "불러오는 중…");
  const proj = await loadProject();
  if (proj && proj.v === 1) {
    if (state.demo) exitDemo();
    state.store = mergeStore(state.store, proj);
    drive.loadedRev = proj.rev || 0;
    ingestIndex(proj.photos);
    saveNow();
  } else {
    drive.loadedRev = 0;
  }
  // 목록(project.json)에 없는 원본이 폴더에 있으면 자동 복구(가벼운 목록 조회로 확인, 있을 때만 내려받음).
  let recovered = 0;
  try { recovered = await recoverCore(); } catch (e) { console.warn("[reconcile]", e); }
  if (recovered) { const rev = (drive.loadedRev || 0) + 1; try { await saveProject(buildProject(rev)); drive.loadedRev = rev; drive.dirty = false; } catch (e) {} }
  // 원격에 아무것도 없고 올릴 로컬 내용도 없으면 빈 프로젝트로 덮어쓰지 않는다(기존 데이터 보호).
  if (!proj && !recovered) {
    const hasLocal = state.photos.some((p) => p.file) ||
      Object.keys(state.store.photoNotes).length || Object.keys(state.store.groupNotes).length || Object.keys(state.store.dayNotes).length;
    if (hasLocal) { pulling = false; await pushToDrive(true); return; }
  }
  computeDays();
  if (state.current === "all" && state.days.length === 1) state.current = state.days[0].key;
  render();
  if (recovered) toast(`드라이브에서 ${recovered}장 복구했습니다`, 4000);
  const toLoad = state.photos.filter((p) => !p.thumbUrl && !p.thumbFailed);
  // 썸네일은 드라이브에서 내려받느라 시간이 걸린다 → 다 받을 때까지 '불러오는 중' 유지(pumpThumbs가 완료 시 '동기화됨'으로)
  if (toLoad.length) { drive.loading = true; setSync("syncing", `사진 불러오는 중 0/${toLoad.length}`); queueThumbs(toLoad); }
  else setSync("synced");
}
let pushing = false, pushQueued = false, syncTimer = null;
function scheduleSync() { if (!isSignedIn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => pushToDrive(), 1200); }
async function conflictMerge() {
  const proj = await loadProject();
  if (proj && (proj.rev || 0) > (drive.loadedRev || 0)) {

function computeDays() {
  const s = state.store.settings;
  const map = new Map();

    const photos = map.get(key).sort((a, b) => a.time - b.time || a.name.localeCompare(b.name));
    const groups = [];

    for (const p of photos) {
      let newGroup = !cur;
      if (cur) {
        const prev = cur.photos[cur.photos.length - 1];
        const gap = p.time - prev.time;
        let auto = gap > s.gapMin * 60000;
        if (!auto && hasGps(p) && lastGps) auto = hav([lastGps.lat, lastGps.lng], [p.lat, p.lng]) > s.distM;
        const o = state.store.breaks[p.key];
        newGroup = o === true ? true : o === false ? false : auto;
        if (tripOf(p) !== tripOf(prev)) newGroup = true; // 다른 여행지 그룹의 사진끼리는 한 묶음이 되지 않게
      }

      const gp = g.photos.filter(hasGps);

const NONE = "none";

function tripOf(p) { const t = state.store.photoTrip[p.key]; return t && state.store.trips[t] ? t : NONE; }
const hasTrips = () => Object.keys(state.store.trips).length > 0;

  const none = { id: NONE, name: "", label: "미분류", groups: [] };
  const byId = new Map(places.map((pl) => [pl.id, pl]));
  for (const d of state.days) for (const g of d.groups) {
    const id = tripOf(g.photos[0]); // 묶음은 그룹 경계에서 끊기므로 첫 사진의 그룹이 곧 묶음의 그룹
    g.place = id; for (const p of g.photos) p.place = id;

// 묶음 카드의 여행지 그룹 선택: 이미 넣은 사진을 묶음 단위로 옮긴다

function renderPanel(opts = {}) {

    if (hasTrips()) {

  } else {

      ${othersHtml}

    let prev = null;
    for (const g of d.groups) {
      if (prev) {
        const gap = g.start - prev.end;
        const dist = prev.center && g.center ? hav(prev.center, g.center) : null;
        h += `<div class="leg" style="--c:${d.color}">이동 ${dist != null ? `직선 ${fmtDist(dist)} · ` : ""}${fmtDur(gap)} 뒤</div>`;
      }
      const gn = state.store.groupNotes[g.key] || {};
      const pn = g.photos.filter((p) => state.store.photoNotes[p.key]);
      const id = hash(g.key);
      h += `<section class="group${state.selectedGroup === g.key ? " selected" : ""}" data-group="${esc(g.key)}" style="--c:${d.color}">

          <div class="gmeta">

            <div class="gsub"><span class="mono">${fmtTime(g.start)}${g.end - g.start >= 60000 ? `–${fmtTime(g.end)}` : ""}</span><span>${g.photos.length}장</span>${g.center ? `<a href="${gmapsUrl(g.center[0], g.center[1])}" target="_blank" rel="noopener">구글맵에서 열기</a>` : "<span>위치 없음</span>"}${placeSelect(g)}</div>
          </div>
          ${g.idx > 0 && full.groups[g.idx - 1].place === g.place ? `<button class="small-btn" data-act="merge" title="바로 앞 묶음과 하나로 합칩니다">앞 묶음과 합치기</button>` : "<span></span>"}
        </div>
        <div class="thumbs">${g.photos.map(thumbHtml).join("")}</div>

        <textarea class="note" id="gn-${id}" data-gnote="${esc(g.key)}" placeholder="이 묶음에 대한 메모 (자동 저장)" aria-label="묶음 ${g.idx + 1} 메모">${esc(gn.text || "")}</textarea>
      </section>`;

  panel.innerHTML = h;
  if (keepScroll != null) { if (window.innerWidth <= 820) window.scrollTo(0, keepScroll); else panel.scrollTop = keepScroll; }

/* ---------- map ---------- */
let map, lg, tiles = {}, markerByGroup = new Map(), mapFitted = false;
function initMap() {
  map = L.map("map", { zoomControl: true, preferCanvas: false }).setView([37.5665, 126.978], 11);
  tiles.map = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19, attribution: "Tiles &copy; Esri &mdash; Esri, HERE, Garmin, USGS, Intermap, INCREMENT P, NRCan, Esri Japan, METI, Esri China (Hong Kong), Esri Korea, Esri (Thailand), NGCC, &copy; OpenStreetMap contributors, and the GIS User Community",
  });
  tiles.sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19, attribution: "Tiles &copy; Esri, Maxar, Earthstar Geographics",
  });
  tiles.map.addTo(map);
  lg = L.layerGroup().addTo(map);
  $("#tileMap").onclick = () => setTiles("map");
  $("#tileSat").onclick = () => setTiles("sat");
}
function setTiles(which) {
  for (const k of ["map", "sat"]) { if (k === which) tiles[k].addTo(map); else map.removeLayer(tiles[k]); }
  $("#tileMap").setAttribute("aria-pressed", which === "map"); $("#tileSat").setAttribute("aria-pressed", which === "sat");
}
function markerIcon(color, text, extra) {
  return L.divIcon({ className: `gmark${extra ? " " + extra : ""}`, html: `<span style="--c:${color}">${esc(text)}</span>`, iconSize: null, iconAnchor: [14, 14] });
}
function renderMap(fit) {
  if (!map) return;
  lg.clearLayers(); markerByGroup.clear();
  const bounds = [];
  const days = (state.current === "all" ? viewDays() : [state.dayByKey.get(state.current)].filter(Boolean)).map(viewOf);
  const placeMarkers = state.current === "all" && state.place === "all" && hasTrips();
  for (const d of days) {
    const pts = d.photos.filter(hasGps).map((p) => [p.lat, p.lng]);
    bounds.push(...pts);
    if (pts.length > 1) L.polyline(pts, { color: d.color, weight: state.current === "all" ? 3 : 4, opacity: 0.85, lineJoin: "round" }).addTo(lg);
    if (state.current === "all") {
      if (pts.length && !placeMarkers) {
        const m = L.marker(pts[0], { icon: markerIcon(d.color, `${d.index + 1}일차`, "day") }).addTo(lg);
        m.bindTooltip(dayLabel(d.key), { direction: "top", offset: [0, -14] });
        m.on("click", () => selectDay(d.key));
      }
      // 여러 날 보기에서도 이름을 붙인 장소는 작은 점 + 이름으로 표시(누르면 그날의 그 묶음으로)
      if (!placeMarkers) {
        for (const g of d.groups) {
          const t = groupTitle(g.key); if (!t || !g.center) continue;
          L.circleMarker(g.center, { radius: 5, color: "#fff", weight: 2, fillColor: d.color, fillOpacity: 1 })
            .bindTooltip(esc(t), { permanent: true, direction: "right", offset: [8, 0], className: "glabel small" })
            .on("click", () => { selectDay(d.key); selectGroup(g.key, { fly: true, scroll: true }); }).addTo(lg);
        }
      }
      continue;
    }
    for (const p of d.photos) {
      if (!hasGps(p)) continue;
      L.circleMarker([p.lat, p.lng], { radius: 4, color: d.color, weight: 2, fillColor: "#fff", fillOpacity: 1 })
        .bindTooltip(fmtTime(p.time), { direction: "top" }).on("click", () => openLightbox(p.key)).addTo(lg);
    }
    for (const g of d.groups) {
      if (!g.center) continue;
      const m = L.marker(g.center, { icon: markerIcon(d.color, g.idx + 1, state.selectedGroup === g.key ? "sel" : ""), zIndexOffset: 500 }).addTo(lg);
      m.fallbackTip = `${fmtTime(g.start)} · ${g.photos.length}장`;
      groupTooltip(m, groupTitle(g.key));
      m.on("click", () => selectGroup(g.key, { fly: false, scroll: true }));
      markerByGroup.set(g.key, m);
    }
  }
  // 모든 여행지 보기: 날짜 마커 대신 여행지 이름 마커(누르면 그 여행지로)
  if (placeMarkers) {
    for (const pl of state.places) {
      if (!pl.center) continue;
      const m = L.marker(pl.center, { icon: markerIcon("#1b2220", pl.label, "day place"), zIndexOffset: 600 }).addTo(lg);
      m.bindTooltip(`${placeRange(pl)} · ${pl.count}장`, { direction: "top", offset: [0, -16] });
      m.on("click", () => selectPlace(pl.id));
    }
  }
  map.invalidateSize(false); // 사진이 없을 때도 컨테이너 높이에 맞춰 타일을 다시 그린다(빈 회색 영역 방지)
  if (fit && bounds.length) {
    const animate = mapFitted; // 첫 맞춤은 즉시, 이후(날짜/탭 전환)에는 부드럽게 확대
    const pad = placeMarkers ? [70, 70] : [40, 40]; // 여행지 이름 마커는 넓어서 가장자리에서 잘리지 않게 여백을 더 준다
    if (bounds.length === 1) animate ? map.flyTo(bounds[0], 16, { duration: 0.7 }) : map.setView(bounds[0], 16);
    else animate ? map.flyToBounds(bounds, { padding: pad, maxZoom: 17, duration: 0.7 }) : map.fitBounds(bounds, { padding: pad, maxZoom: 17 });
    mapFitted = true;
  }
}
// 묶음 마커 툴팁: 이름이 있으면 마커 옆에 항상, 없으면 마우스를 올렸을 때 시각·장수
function groupTooltip(m, title) {
  m.unbindTooltip();
  if (title) m.bindTooltip(esc(title), { permanent: true, direction: "right", offset: [16, 0], className: "glabel" });
  else m.bindTooltip(m.fallbackTip, { direction: "top", offset: [0, -14] });
}
function selectDay(key) {
  state.current = key; state.selectedGroup = null;
  render();
}
function selectPlace(id, keepDay) {
  state.place = id; state.selectedGroup = null;
  if (!keepDay || !viewDays().some((d) => d.key === state.current)) state.current = "all";
  render();
}
// 사진들을 여행지 그룹(또는 미분류)으로 옮기고 그룹 이름을 돌려준다
function movePhotos(photos, val) {
  for (const p of photos) { if (val === NONE) delete state.store.photoTrip[p.key]; else state.store.photoTrip[p.key] = val; }
  saveSoon(); computeDays();
  const t = state.store.trips[val];
  return t ? t.name || "이름 없는 그룹" : "미분류";
}
function tripOptions(exclude) {
  return tripList().filter((t) => t.id !== exclude).map((t) => `<option value="${esc(t.id)}">${esc(t.name || "이름 없는 그룹")}</option>`).join("") +
    (exclude === NONE ? "" : `<option value="${NONE}">미분류</option>`);
}
function setGroupPlace(gkey, val) {
  const g = state.days.flatMap((d) => d.groups).find((x) => x.key === gkey); if (!g) return;
  const name = movePhotos(g.photos, val);
  render({ keepScroll: true, fit: false });
  toast(`묶음 ${g.photos.length}장을 ‘${name}’(으)로 옮겼습니다`);
}
// 하루 보기의 사진(그룹 탭이면 그 그룹 부분)을 통째로 옮기고, 그룹 탭이었다면 옮긴 그룹으로 따라간다
function moveDay(dayKey, val) {
  const photos = viewOf(state.dayByKey.get(dayKey)).photos;
  const name = movePhotos(photos, val);
  if (state.place !== "all") { state.place = state.placeById.has(val) ? val : "all"; state.current = dayKey; }
  render({ fit: false });
  toast(`이날 사진 ${photos.length}장을 ‘${name}’(으)로 옮겼습니다`);
}
function createTrip(name) {
  name = name.trim(); state.newTrip = false;
  if (!name) { renderTabs(); return; }
  const id = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  state.store.trips[id] = { name, created: Date.now() };
  saveSoon(); computeDays(); selectPlace(id);
  toast(`‘${name}’ 그룹을 만들었습니다 · 이 탭에서 추가한 사진이 이 그룹에 들어갑니다`, 5000);
}
function deleteTrip(id) {

/* ---------- images: thumbnails / full view / JPEG ---------- */
const fullCache = new Map(); // key -> objectURL (HEIC 변환본), 최근 8개만
function cacheFull(key, url) {
  fullCache.set(key, url);
  while (fullCache.size > 8) { const [k, u] = fullCache.entries().next().value; URL.revokeObjectURL(u); fullCache.delete(k); }
}
async function heicToJpegBlob(file, quality) {

  const out = await heic2any({ blob: file, toType: "image/jpeg", quality });

}
// 사진의 원본 바이트: 로컬은 File, 원격(다른 기기서 넣은 사진)은 드라이브에서 내려받음
async function sourceBlob(p) {

  if (p.originalFileId) return await driveDownload(p.originalFileId);
  throw new Error("원본을 찾을 수 없습니다");
}
// 브라우저가 바로 그릴 수 있는 Blob을 돌려줌 (HEIC는 필요할 때만 변환)
async function decodableBlob(p, quality = 0.9) {
  const src = await sourceBlob(p);
  if (p.nativeOk === true) return src;
  if (p.nativeOk == null) {
    try { const bm = await createImageBitmap(src); bm.close && bm.close(); p.nativeOk = true; return src; }
    catch (e) { p.nativeOk = false; }
  }
  if (isHeicPhoto(p) || isHeicFile(src)) {
    const cached = fullCache.get(p.key);
    if (cached) return await (await fetch(cached)).blob();
    const blob = await heicToJpegBlob(src, quality);
    cacheFull(p.key, URL.createObjectURL(blob));
    return blob;

}
async function makeThumb(p) {
  const blob = await decodableBlob(p);

  const S = 360, sc = Math.min(1, S / Math.min(bm.width, bm.height));
  const c = document.createElement("canvas"); c.width = Math.round(bm.width * sc); c.height = Math.round(bm.height * sc);
  c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height); bm.close && bm.close();
  const tb = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.8));

}
// 원격 사진은 드라이브에 저장된 썸네일(360px JPEG)을 그대로 받아 쓰고, 로컬 사진은 즉석 생성
// 드라이브에 저장된 썸네일(360px JPEG)이 있으면 그걸 받아 쓰고(원본 변환보다 훨씬 빠름), 없거나 실패하면 원본으로 즉석 생성
async function loadThumb(p) {
  if (p.thumbFileId && isSignedIn()) {
    try { p.thumbUrl = URL.createObjectURL(await driveDownload(p.thumbFileId)); return; }
    catch (e) { if (!p.file) throw e; console.warn("[drive] 썸네일 받기 실패 → 원본으로 생성", p.name, e); }
  }
  await makeThumb(p);
}
let thumbQueue = [], thumbRunning = 0, thumbDone = 0, thumbTotal = 0;
function queueThumbs(list) {
  thumbQueue.push(...list); thumbTotal += list.length;
  for (let i = 0; i < 2; i++) pumpThumbs();
}
async function pumpThumbs() {
  if (thumbRunning >= 2) return;
  const p = thumbQueue.shift();
  if (!p) {
    if (!thumbRunning) {
      progress(null); thumbDone = thumbTotal = 0;
      // 드라이브에서 불러오는 중이었다면 다 받은 뒤에 '동기화됨'으로
      if (drive.loading) { drive.loading = false; setSync("synced"); }
      if (isSignedIn()) scheduleSync();
    }
    return;
  }
  thumbRunning++;
  const remote = !p.file || !!(p.thumbFileId && isSignedIn()); // 드라이브에서 썸네일을 내려받는 사진
  try { await loadThumb(p); } catch (e) { p.thumbFailed = true; console.warn(p.name, e); }
  thumbRunning--; thumbDone++;
  const label = remote ? "드라이브에서 사진 불러오는 중" : "미리보기 만드는 중";
  progress(`${label} ${thumbDone}/${thumbTotal}`, thumbDone / thumbTotal);
  if (drive.loading) setSync("syncing", `사진 불러오는 중 ${thumbDone}/${thumbTotal}`);
  document.querySelectorAll(`.thumb[data-photo="${CSS.escape(p.key)}"]`).forEach((el) => { el.outerHTML = thumbHtml(p); });
  pumpThumbs();
}
async function fullUrl(p) {
  if (p.demoUrl) return p.demoUrl;
  if (fullCache.has(p.key)) return fullCache.get(p.key);
  const blob = await decodableBlob(p, 0.92);
  if (fullCache.has(p.key)) return fullCache.get(p.key); // HEIC 변환본은 decodableBlob 내부에서 캐시됨
  const u = URL.createObjectURL(blob); cacheFull(p.key, u); return u;
}
function toExifDate(d) { return `${d.getFullYear()}:${pad(d.getMonth() + 1)}:${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }

  v = Math.abs(v); const d = Math.floor(v), mf = (v - d) * 60, m = Math.floor(mf), s = Math.round((mf - m) * 60 * 10000);

function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }

  else {
    const bm = await createImageBitmap(src);

    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bm, 0, 0); bm.close && bm.close();

async function exportZip(day, label) {

  for (let i = 0; i < day.photos.length; i++) {

    const base = p.name.replace(/\.[^.]+$/, "");
    const t = p.time;
    let name = `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}_${pad(t.getHours())}${pad(t.getMinutes())}${pad(t.getSeconds())}_${base}.jpg`;
    for (let n = 2; used.has(name.toLowerCase()); n++) name = name.replace(/(_\d+)?\.jpg$/, `_${n}.jpg`);
    used.add(name.toLowerCase());
    try {
      const src = await sourceBlob(p);
      if (isJpegPhoto(p) || isJpegFile(src)) zip.file(name, src);

}

/* ---------- file ingest ---------- */
async function readMeta(f) {
  let out = null;
  try {
    out = await exifr.parse(f, { tiff: true, exif: true, gps: true, ifd1: false, xmp: false, icc: false, iptc: false, jfif: false, ihdr: false });
  } catch (e) { /* EXIF 없음 */ }
  const weak = !out || (!out.DateTimeOriginal && !Number.isFinite(out.latitude));
  if (weak && !isJpegFile(f)) {
    // 일부 HEIC(삼성·libheif 등)는 exifr가 컨테이너를 못 읽는 경우가 있어, 파일 안의 "Exif\0\0" + TIFF 블록을 직접 찾아 다시 읽음
    try {
      const u8 = new Uint8Array(await f.arrayBuffer());
      for (let i = u8.indexOf(0x45); i >= 0 && i < u8.length - 10; i = u8.indexOf(0x45, i + 1)) {
        if (u8[i + 1] === 0x78 && u8[i + 2] === 0x69 && u8[i + 3] === 0x66 && u8[i + 4] === 0 && u8[i + 5] === 0 &&
            ((u8[i + 6] === 0x4d && u8[i + 7] === 0x4d) || (u8[i + 6] === 0x49 && u8[i + 7] === 0x49))) {
          const o2 = await exifr.parse(u8.slice(i + 6, i + 6 + 262144), { tiff: true, exif: true, gps: true, ifd1: false });
          if (o2) out = Object.assign({}, out, o2);
          break;
        }
      }
    } catch (e) { /* 그래도 없으면 파일 시각 사용 */ }
  }
  let time = out && (out.DateTimeOriginal || out.CreateDate || out.DateTime);
  let est = false;
  if (!(time instanceof Date) || isNaN(time)) { time = new Date(f.lastModified); est = true; }
  let lat = out && out.latitude, lng = out && out.longitude;
  if (!Number.isFinite(lat) || !Number.isFinite(lng) || (lat === 0 && lng === 0)) { lat = null; lng = null; }
  return { time, est, lat, lng, make: out && out.Make, model: out && out.Model };
}
async function addFiles(fileList) {
  const files = [...fileList].filter(isImageFile);
  if (!files.length) { toast("사진 파일을 찾지 못했습니다"); return; }
  if (state.demo) exitDemo();
  const added = [], healed = [];
  let noTime = 0, noGps = 0, dup = 0, moved = 0;
  // 여행지 그룹 탭을 고른 채 추가하면 그 그룹에 넣는다(이미 있는 사진은 그 그룹으로 옮김)
  const trip = state.store.trips[state.place] ? state.place : null;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (i % 5 === 0) progress(`사진 정보 읽는 중 ${i + 1}/${files.length}`, i / files.length);
    const m = await readMeta(f);
    const key = `${f.name}|${fmtStamp(m.time)}`;
    const ex = state.byKey.get(key);
    if (trip && state.store.photoTrip[key] !== trip) { state.store.photoTrip[key] = trip; if (ex) moved++; }
    if (ex) {
      // 드라이브에서 받아온 원격 전용 사진(로컬 파일 없음)에 방금 고른 원본을 붙여 로컬 파일로 바로 본다.
      // 드라이브 원본과 크기가 같으면 이미 올라간 것이므로 다시 올리지 않는다(중단 후 다시 추가해도 중복 업로드 없음).
      // 크기가 다르면(깨진 업로드) 다음 동기화 때 다시 올리고, 옛 파일은 휴지통으로 보낸다.
      if (!ex.file) {
        const same = ex.originalFileId && (ex.size == null || Number(ex.size) === f.size);
        // 같은 원본이면 드라이브에서 받은 썸네일을 그대로 쓴다(미리보기를 다시 만들지 않음)

          ex.originalFileId = null; ex.thumbFileId = null; ex.thumbUrl = null;

        }

        healed.push(ex);

    if (m.est) noTime++;
    if (!hasGps(p)) noGps++;

  }
  progress(null);
  if (trip) saveSoon();
  computeDays();
  if (state.current === "all" && viewDays().length === 1) state.current = viewDays()[0].key;
  render();
  // 다시 연결한 사진은 썸네일이 없고 이미 대기열에 있지 않을 때만(드라이브 썸네일 받는 중이면 그대로 둠)

  if (added.length || !moved) bits.push(`${tname ? tname + "에 " : ""}${added.length}장 추가`);
  if (moved) bits.push(added.length ? `${moved}장 이 그룹으로 옮김` : `${tname}(으)로 ${moved}장 옮김`);
  if (healed.length) bits.push(`드라이브 사진 ${healed.length}장에 원본 연결`);
  if (noGps) bits.push(`위치 없음 ${noGps}장`);
  if (noTime) bits.push(`촬영 시각 없음 ${noTime}장 (파일 수정 시각으로 대신함)`);
  if (dup) bits.push(`중복 ${dup}장 건너뜀`);

}
async function collectDropped(dt) {
  const items = dt.items ? [...dt.items] : [];
  const entries = items.map((it) => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  async function walk(entry) {
    if (entry.isFile) { out.push(await new Promise((res, rej) => entry.file(res, rej))); return; }
    if (entry.isDirectory) {
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        if (!batch.length) break;
        for (const e of batch) await walk(e);
      }
    }
  }
  for (const e of entries) await walk(e);
  return out;
}

    img.onload = () => { if (token === lbToken) $("#lbLoading").hidden = true; };
    img.src = url; img.alt = p.name; $("#lbLoading").hidden = true;
  } catch (e) {
    if (token !== lbToken) return;
    $("#lbLoading").textContent = `이 사진을 표시하지 못했습니다: ${e.message || e}${remoteMsg}`;
  }
}
function closeLightbox() {
  $("#lightbox").hidden = true; document.body.style.overflow = ""; const k = state.lb; state.lb = null; lbToken++;
  renderPanel({ keepScroll: true });
  if (k) { const el = document.querySelector(`.thumb[data-photo="${CSS.escape(k)}"]`); if (el) el.focus({ preventScroll: true }); }
}
function lbStep(dir) {
  const p = state.byKey.get(state.lb); if (!p) return;
  const list = lbList(p); const i = list.indexOf(p) + dir;
  if (i >= 0 && i < list.length) openLightbox(list[i].key);
}

/* ---------- demo ---------- */
function demoImage(label, sub, hue) {
  const c = document.createElement("canvas"); c.width = 960; c.height = 720; const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 960, 720);
  g.addColorStop(0, `hsl(${hue} 45% 62%)`); g.addColorStop(1, `hsl(${(hue + 40) % 360} 40% 32%)`);
  x.fillStyle = g; x.fillRect(0, 0, 960, 720);
  x.fillStyle = "rgba(255,255,255,.12)"; for (let i = 0; i < 7; i++) x.fillRect(80 + i * 120, 300 - i * 18, 70, 420);
  x.fillStyle = "#fff"; x.font = "600 54px 'IBM Plex Sans KR', sans-serif"; x.fillText(label, 130, 300);
  x.font = "400 30px 'IBM Plex Mono', monospace"; x.fillText(sub, 132, 350);
  x.font = "500 26px 'IBM Plex Sans KR', sans-serif"; x.fillStyle = "rgba(255,255,255,.8)"; x.fillText("예시 이미지", 132, 640);
  return c.toDataURL("image/jpeg", 0.8);
}

  });
  state.byKey = new Map(state.photos.map((p) => [p.key, p]));

  state.store.groupNotes[k(5)] = { title: "기요미즈데라", text: "본당 목조 무대는 못 하나 없이 짜 맞춘 구조." };

  state.store.photoNotes[k(6)] = "무대 아래 기둥 구조 사진은 오쿠노인 쪽에서 찍어야 잘 나옴.";
  state.store.dayNotes["2026-09-10"] = "남쪽(후시미)에서 시작해 북쪽(기온)으로 올라가는 동선. 걸은 거리가 꽤 됨.";

function exitDemo() {
  state.demo = false; state.photos = []; state.byKey = new Map(); state.store = loadStore(); state.current = "all"; state.selectedGroup = null;
  $("#demoBanner").hidden = true; syncSettingsInputs();
}

/* ---------- settings ---------- */
function syncSettingsInputs() {
  const s = state.store.settings;
  $("#setDayStart").value = s.dayStartHour; $("#setDist").value = s.distM; $("#setGap").value = s.gapMin;
}
function onSetting(id, field, min, max) {
  $(id).addEventListener("change", (e) => {
    let v = Math.round(Number(e.target.value)); if (!Number.isFinite(v)) v = state.store.settings[field];
    v = Math.min(max, Math.max(min, v)); e.target.value = v;
    state.store.settings[field] = v; saveSoon(); computeDays(); render({ fit: false });
  });
}

/* ---------- events ---------- */
function bind() {
  $("#fileInput").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
  $("#dirInput").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
  $("#dayTabs").addEventListener("click", (e) => { const b = e.target.closest("[data-day]"); if (b) selectDay(b.dataset.day); });
  const pt = $("#placeTabs");
  pt.addEventListener("click", (e) => {
    const b = e.target.closest("[data-place]"); if (b) { selectPlace(b.dataset.place); return; }
    if (e.target.closest("[data-newtrip]")) { state.newTrip = true; renderTabs(); }
  });
  pt.addEventListener("keydown", (e) => {
    if (e.target.id !== "tripNew") return;
    if (e.key === "Enter") { e.preventDefault(); createTrip(e.target.value); }
    if (e.key === "Escape") { state.newTrip = false; renderTabs(); }
  });
  pt.addEventListener("focusout", (e) => { if (e.target.id === "tripNew" && state.newTrip) createTrip(e.target.value); });
  const panel = $("#panel");
  panel.addEventListener("click", (e) => {
    const pc = e.target.closest("[data-place]"); if (pc) { selectPlace(pc.dataset.place); return; }
    const gp = e.target.closest("[data-goplace]"); if (gp) { selectPlace(gp.dataset.goplace, true); return; }
    const dt = e.target.closest("[data-deltrip]"); if (dt) { deleteTrip(dt.dataset.deltrip); return; }
    const dc = e.target.closest(".daycard"); if (dc) { selectDay(dc.dataset.day); return; }
    const ph = e.target.closest("[data-photo]"); if (ph) { openLightbox(ph.dataset.photo); return; }
    const act = e.target.closest("[data-act]"); if (!act) return;
    const gkey = act.closest(".group").dataset.group;
    if (act.dataset.act === "focus") selectGroup(gkey, { fly: true, scroll: false });
    if (act.dataset.act === "merge") mergeWithPrevious(gkey);
  });
  panel.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.gtitle) {
      setGroupNote(t.dataset.gtitle, "title", t.value.trim() ? t.value : "");
      const m = markerByGroup.get(t.dataset.gtitle); if (m) groupTooltip(m, t.value.trim());
    } else if (t.dataset.gnote) setGroupNote(t.dataset.gnote, "text", t.value);
    else if (t.dataset.pname) setPlaceName(t.dataset.pname, t.value);
    else if (t.dataset.daynote) {
      if (t.value) state.store.dayNotes[t.dataset.daynote] = t.value; else delete state.store.dayNotes[t.dataset.daynote];
      saveSoon();
    }
  });
  panel.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.gplace) setGroupPlace(t.dataset.gplace, t.value);
    else if (t.dataset.daymove && t.value) moveDay(t.dataset.daymove, t.value);
    else if (t.dataset.pname) commitPlaceName();
  });
  $("#lbNote").addEventListener("input", (e) => {
    if (!state.lb) return;
    if (e.target.value) state.store.photoNotes[state.lb] = e.target.value; else delete state.store.photoNotes[state.lb];
    saveSoon();
  });
  $("#lbClose").onclick = closeLightbox;
  $("#lbPrev").onclick = () => lbStep(-1);
  $("#lbNext").onclick = () => lbStep(1);
  $("#lbSplit").onclick = () => { const k = state.lb; splitAt(k); openLightbox(k); };
  $("#lbTrip").addEventListener("change", (e) => {
    const k = state.lb, p = state.byKey.get(k); if (!p || e.target.value === p.place) return;
    const name = movePhotos([p], e.target.value);
    render({ keepScroll: true, fit: false }); openLightbox(k);
    toast(`이 사진을 ‘${name}’(으)로 옮겼습니다`);
  });
  $("#lbShowMap").onclick = () => {
    const p = state.byKey.get(state.lb); closeLightbox();
    if (p && hasGps(p)) {
      if (state.place !== "all" && state.place !== p.place) state.place = p.place;
      if (state.current !== p.dayKey) selectDay(p.dayKey);
      selectGroup(p.groupKey, { fly: false, scroll: true });
      map.flyTo([p.lat, p.lng], 18, { duration: 0.6 });
    }
  };
  $("#lbStage").addEventListener("click", (e) => { if (e.target.id === "lbStage") closeLightbox(); });
  let tx = null;
  $("#lbStage").addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
  $("#lbStage").addEventListener("touchend", (e) => {
    if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) lbStep(dx < 0 ? 1 : -1);
  });
  document.addEventListener("keydown", (e) => {
    if (!state.lb) return;
    const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (e.key === "Escape") { if (typing) document.activeElement.blur(); else closeLightbox(); }
    if (typing) return;
    if (e.key === "ArrowLeft") lbStep(-1);
    if (e.key === "ArrowRight") lbStep(1);
  });

  // 메모 파일
  $("#btnExportNotes").onclick = () => {
    $("#menuData").open = false;
    if (state.demo) { toast("예시 메모는 저장하지 않습니다. 사진을 추가한 뒤 저장하세요"); return; }
    const d = new Date();
    const payload = Object.assign({}, state.store, {
      exportedAt: d.toISOString(),
      photos: state.photos.map((p) => ({ key: p.key, name: p.name, time: p.time.toISOString(), lat: p.lat, lng: p.lng })),
    });
    download(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }), `사진동선_메모_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`);
    toast("메모 파일을 저장했습니다");
  };
  $("#importInput").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = ""; $("#menuData").open = false; if (!f) return;
    try {
      const s = JSON.parse(await f.text());
      if (!s || s.v !== 1) throw new Error("형식이 다릅니다");
      if (state.demo) exitDemo();
      state.store = mergeStore(state.store, s); saveNow(); syncSettingsInputs(); computeDays(); render({ fit: false });
      const n = Object.keys(s.photoNotes || {}).length + Object.keys(s.groupNotes || {}).length + Object.keys(s.dayNotes || {}).length;
      toast(`메모 ${n}개를 불러왔습니다${state.photos.length ? "" : " · 같은 사진을 추가하면 메모가 붙습니다"}`, 5000);
    } catch (err) { toast(`메모 파일을 읽지 못했습니다: ${err.message}`); }
  });

  // ZIP
  $("#btnZipDay").onclick = async () => {
    $("#menuData").open = false;
    if (state.demo || !state.photos.length) { toast("먼저 사진을 추가하세요"); return; }
    if (state.current === "all") { toast("날짜 탭을 먼저 고르세요. 전체는 '전체 사진 JPEG로 저장'을 쓰세요"); return; }
    const r = await exportZip(state.dayByKey.get(state.current), dayLabel(state.current, true));
    progress(null); toast(`저장 완료 · JPEG로 변환 ${r.converted}장${r.failed ? ` · 실패 ${r.failed}장` : ""}`, 5000);
  };
  $("#btnZipAll").onclick = async () => {
    $("#menuData").open = false;
    if (state.demo || !state.photos.length) { toast("먼저 사진을 추가하세요"); return; }
    let conv = 0, fail = 0;
    for (const d of state.days) { const r = await exportZip(d, dayLabel(d.key, true)); conv += r.converted; fail += r.failed; }
    progress(null); toast(`ZIP ${state.days.length}개 저장 · JPEG로 변환 ${conv}장${fail ? ` · 실패 ${fail}장` : ""}`, 6000);
  };

  // 연동
  $("#btnSignIn").onclick = () => { $("#menuSync").open = false; signIn(); };
  $("#btnSyncNow").onclick = () => { $("#menuSync").open = false; syncNow(); };
  $("#btnRecover").onclick = () => { $("#menuSync").open = false; recoverFromDrive(); };
  $("#btnSignOut").onclick = () => { $("#menuSync").open = false; signOut(); };

  // settings
  onSetting("#setDayStart", "dayStartHour", 0, 8);
  onSetting("#setDist", "distM", 20, 2000);
  onSetting("#setGap", "gapMin", 1, 240);
  $("#btnResetBreaks").onclick = () => {
    $("#menuSettings").open = false; state.store.breaks = {}; saveSoon(); computeDays(); render({ fit: false });
    toast("자동 묶음으로 되돌렸습니다");
  };
  document.addEventListener("click", (e) => {
    for (const m of document.querySelectorAll("details.menu[open]")) if (!m.contains(e.target)) m.open = false;
  });

  // drag & drop
  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) { dragDepth++; $("#dropHint").hidden = false; } });
  window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("#dropHint").hidden = true; });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", async (e) => {
    e.preventDefault(); dragDepth = 0; $("#dropHint").hidden = true;
    if (!e.dataTransfer) return;
    const files = await collectDropped(e.dataTransfer);
    addFiles(files);
  });
  window.addEventListener("resize", () => map && map.invalidateSize());
}

/* ---------- boot ---------- */
function boot() {
  const missing = [];
  if (typeof L === "undefined") missing.push("지도(Leaflet)");
  if (typeof exifr === "undefined") missing.push("EXIF 판독기");
  if (missing.length) { document.getElementById("panel").innerHTML = `<div class="panel-inner"><div class="empty"><h2>도구를 불러오지 못했습니다</h2><p>${missing.join(", ")}</p></div></div>`; return; }
  initMap(); bind(); syncSettingsInputs();
  render();
  initDrive(); // 저장된 토큰이 있으면 자동 재연결해 드라이브에서 사진을 불러온다
  setTimeout(() => renderMap(true), 80);
  if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById("map"));
  if (!storageOk) toast("이 브라우저에서는 자동 저장이 안 됩니다. 메모 파일로 저장하세요", 6000);
}
boot();
})();
